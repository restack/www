name: Build and Push Docker Image

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  workflow_dispatch:

env:
  REGISTRY: harbor.home.lab
  REPO: restack/www

jobs:
  build:
    runs-on: homelab-gh
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.REPO }}
          tags: |
            # Branch: branch-shortsha (e.g., main-a1b2c3d)
            type=raw,value=${{ github.ref_name }}-{{sha}},enable=${{ github.ref_type == 'branch' }}
            # Tag: v1.0.0
            type=ref,event=tag
            # Latest tag for main branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Login to Harbor
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: remote
          endpoint: tcp://buildkitd.buildkit.svc.cluster.local:1234

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ github.sha }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.REPO }}:cache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.REPO }}:cache,mode=max

      - name: Update k8s manifest
        uses: restack/actions/actions/k8s-manifest-updater@v1
        with:
          app_id: ${{ secrets.APP_ID }}
          private_key: ${{ secrets.APP_PRIVATE_KEY }}
          installation_id: ${{ secrets.APP_INSTALLATION_ID }}
          manifest_repo: 'ziwon/homelab'
          manifest_path: 'platform/stacks/05-workloads/overlays/home/landing.yaml'
          image: ${{ env.REGISTRY }}/${{ env.REPO }}:${{ steps.meta.outputs.version }}
          yaml_path: apps[name=landing].source.helm.values
          nested_yaml_path: 'template.spec.containers[name=landing].image'
          branch: main
          create_pr: false

      - name: Image summary
        run: |
          echo "### Image Built Successfully :rocket:" >> $GITHUB_STEP_SUMMARY
          echo "**Repository:** \`${{ env.REPO }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** \`${{ steps.meta.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Tags:**" >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" | while read tag; do
            echo "- \`$tag\`" >> $GITHUB_STEP_SUMMARY
          done